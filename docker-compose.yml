services:
  web:
    build: ./apps/web
    ports:
      - "3010:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8010
    depends_on:
      - api

  api:
    build: ./services/api
    ports:
      - "8010:8000"
    volumes:
      - ./services/api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://mori:mori@db:5432/mori
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: mori
      S3_SECRET_KEY: mori-dev-secret
      S3_BUCKET: mori-media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./services/api
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    volumes:
      - ./services/api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://mori:mori@db:5432/mori
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: mori
      S3_SECRET_KEY: mori-dev-secret
      S3_BUCKET: mori-media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mori
      POSTGRES_PASSWORD: mori
      POSTGRES_DB: mori
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mori"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mori
      MINIO_ROOT_PASSWORD: mori-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pgdata:
  minio_data:
  web_node_modules:
