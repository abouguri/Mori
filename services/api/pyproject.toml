[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "mori-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.10",
  "email-validator>=2.2",
  "pydantic-settings>=2.7",
  "arq>=0.26",
  "redis>=5.2",
  "zstandard>=0.23",
  "protobuf>=5.29",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "uuid-utils>=0.9",
  "aioboto3>=13.2",
  "python-multipart>=0.0.19",
  "nh3>=0.2",
  "fsrs>=6.3",
]

[project.optional-dependencies]
# §08.4 Tier 2 FSRS parameter tuning. Pulls in torch/pandas/scikit-learn —
# installed only in the worker image (services/api/Dockerfile), never the
# API image, since it's only ever invoked from the isolated subprocess in
# app/workers/optimize_subprocess.py.
optimizer = [
  "fsrs-optimizer>=6.5",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.14",
  "hypothesis>=6.122",
  "grpcio-tools>=1.68",  # `make proto` — regenerates app/importer/proto/anki/*_pb2.py
]

[tool.ruff]
line-length = 100
# Generated protobuf code — never hand-edited, regenerated via `make proto`.
extend-exclude = ["app/importer/proto/anki/*_pb2.py"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
