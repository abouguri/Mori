name: CI

on:
  push:
  pull_request:

jobs:
  # apps/web depends on packages/renderer via npm workspaces, so both are
  # installed and checked together from the repo root — an isolated install
  # scoped to apps/web alone can't resolve the workspace-linked package.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck --workspace=packages/renderer
      - run: npm test --workspace=packages/renderer
      - run: npm run lint --workspace=apps/web
      - run: npm run typecheck --workspace=apps/web
      - run: npm run build --workspace=apps/web

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mori
          POSTGRES_PASSWORD: mori
          POSTGRES_DB: mori
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://mori:mori@localhost:5432/mori
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: mori
      S3_SECRET_KEY: mori-dev-secret
      S3_BUCKET: mori-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The official minio/minio image needs its command set explicitly
      # (`server /data`), which the `services:` block above can't do — it
      # only runs a container's default CMD. Bitnami's image used to fill
      # that gap with sane defaults, but bitnami/minio was pulled from
      # Docker Hub's free tier, so this starts it by hand instead.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=mori -e MINIO_ROOT_PASSWORD=mori-dev-secret \
            minio/minio server /data --console-address ":9001"
          timeout 30 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest
